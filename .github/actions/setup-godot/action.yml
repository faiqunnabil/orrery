name: Set up Godot
description: Installs the Godot editor for Linux and, optionally, the Linux and Windows export templates, with caching.

inputs:
  version:
    description: Godot version without the "-stable" suffix
    default: "4.7.2"
  templates:
    description: Also install the Linux and Windows export templates
    default: "false"

runs:
  using: composite
  steps:
    - name: Restore the Godot editor
      id: editor
      uses: actions/cache@v4
      with:
        path: ~/godot
        key: godot-editor-${{ inputs.version }}-linux-x86_64

    - name: Download the Godot editor
      if: steps.editor.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/godot
        curl -fsSL -o /tmp/godot.zip \
          "https://github.com/godotengine/godot/releases/download/${{ inputs.version }}-stable/Godot_v${{ inputs.version }}-stable_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d ~/godot
        rm /tmp/godot.zip

    - name: Put Godot on the PATH
      shell: bash
      run: |
        sudo ln -sf "$HOME/godot/Godot_v${{ inputs.version }}-stable_linux.x86_64" /usr/local/bin/godot
        godot --headless --version

    - name: Restore the export templates
      if: inputs.templates == 'true'
      id: templates
      uses: actions/cache@v4
      with:
        path: ~/.local/share/godot/export_templates/${{ inputs.version }}.stable
        key: godot-templates-${{ inputs.version }}-linux-windows

    - name: Download the export templates
      if: inputs.templates == 'true' && steps.templates.outputs.cache-hit != 'true'
      shell: bash
      run: |
        target="$HOME/.local/share/godot/export_templates/${{ inputs.version }}.stable"
        mkdir -p "$target" /tmp/templates
        curl -fsSL -o /tmp/templates.tpz \
          "https://github.com/godotengine/godot/releases/download/${{ inputs.version }}-stable/Godot_v${{ inputs.version }}-stable_export_templates.tpz"
        unzip -q /tmp/templates.tpz \
          templates/version.txt \
          templates/linux_release.x86_64 \
          templates/windows_release_x86_64.exe \
          templates/windows_release_x86_64_console.exe \
          -d /tmp/templates
        mv /tmp/templates/templates/* "$target/"
        rm -rf /tmp/templates /tmp/templates.tpz
